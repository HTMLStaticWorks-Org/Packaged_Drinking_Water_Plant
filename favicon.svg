<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3f63"/>
      <stop offset="50%" stop-color="#072b44"/>
      <stop offset="100%" stop-color="#031624"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#99f7ff"/>
      <stop offset="35%" stop-color="#28d4ed"/>
      <stop offset="75%" stop-color="#0889cf"/>
      <stop offset="100%" stop-color="#035e96"/>
    </linearGradient>
    <radialGradient id="dropGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a3f63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="35%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#rimGrad)" stroke-width="1.2"/>

  <!-- Under-drop soft ambient glow halo -->
  <ellipse cx="32" cy="40" rx="20" ry="14" fill="url(#dropGlow)"/>

  <!-- Water drop main body -->
  <path d="M32 9 C26.5 17.5 14.5 27.5 14.5 38 A17.5 17.5 0 0 0 49.5 38 C49.5 27.5 37.5 17.5 32 9 Z"
        fill="url(#dropGrad)"/>

  <!-- Upper-left specular gloss highlight -->
  <path d="M32 9 C26.5 17.5 14.5 27.5 14.5 38 A17.5 17.5 0 0 0 49.5 38 C49.5 27.5 37.5 17.5 32 9 Z"
        fill="url(#gloss)"/>

  <!-- Water ripple curves -->
  <path d="M22 41.5 Q27 37 32 41.5 Q37 46 42 41.5"
        fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
  <path d="M24.5 35.5 Q28.2 32.5 32 35.5 Q35.8 38.5 39.5 35.5"
        fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

  <!-- Modern Geometric Apex Accent -->
  <path d="M32 15 L28.5 22.5 L35.5 22.5"
        fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Micro splash sparkles -->
  <circle cx="42" cy="15" r="2.2" fill="#a5f3fc"/>
  <circle cx="47" cy="10.5" r="1.3" fill="#67e8f9" opacity="0.8"/>
  <circle cx="40" cy="9.5" r="0.9" fill="#38bdf8" opacity="0.7"/>
</svg>
